[package]
name = "shard"
description = "A declarative instance manager for Prism Launcher"
version = "0.1.0"
edition = "2024"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
miette = { version = "7.6.0", features = ["derive", "fancy"] }
rust-ini = "0.21.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.20"
yaml_serde = "0.10"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
